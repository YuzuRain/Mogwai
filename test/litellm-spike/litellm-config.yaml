# 对外模型名遵循 tech-design §2.2 的 provider/model 形式(pre-call hook 据此取 provider)
model_list:
  - model_name: openai/gpt-3.5-turbo
    litellm_params:
      model: openai/gpt-3.5-turbo
      api_base: http://fake-provider:8080/v1
      # 占位值:真实 Key 由 key_resolver pre-call hook 从 Redis 投影解密注入。
      # 若上游收到这个占位值,说明注入失败,verify.sh 会断言失败。
      api_key: "placeholder-must-be-overridden-by-key-resolver"
  - model_name: anthropic/claude-3-haiku
    litellm_params:
      model: anthropic/claude-3-haiku
      api_base: http://fake-provider:8080
      api_key: "placeholder-must-be-overridden-by-key-resolver"

general_settings:
  custom_auth: plugins.platform_auth.user_api_key_auth

litellm_settings:
  callbacks:
    - plugins.key_resolver.key_resolver_instance
    - plugins.usage_publisher.usage_publisher_instance
